<!-- Bannière installation PWA -->
<div id="pwa-banner">

<!-- ═══════════════════════════════════════════════════════════
     BLOC 4 — JavaScript à ajouter dans votre <script> inline
               (à la toute fin, avant le dernier })
     ═══════════════════════════════════════════════════════════ -->
<script>
/* ════════════════════════════════════════════════════════════
   PWA — Service Worker + Notifications Push
   ════════════════════════════════════════════════════════════ */

const PUSH_WORKER_URL = 'https://VOTRE_WORKER_PUSH_URL.workers.dev';
const ADMIN_SECRET    = 'VOTRE_MOT_DE_PASSE_ADMIN'; /* ← changer ici */

let _swRegistration  = null;
let _deferredPrompt  = null;
let _pushSubscription = null;

/* ── Enregistrement du Service Worker ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(function(reg) {
    _swRegistration = reg;
    console.info('[Ode PWA] SW enregistré');
    /* Demander permission notifications après 3s */
    setTimeout(requestPushPermission, 3000);
  }).catch(function(e) {
    console.warn('[Ode PWA] SW échec:', e);
  });
}

/* ── Bannière installation ── */
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  _deferredPrompt = e;
  /* Afficher la bannière seulement si pas encore installé */
  if (!window.matchMedia('(display-mode: standalone)').matches) {
    document.getElementById('pwa-banner').classList.add('show');
  }
});

function pwaInstall() {
  document.getElementById('pwa-banner').classList.remove('show');
  if (_deferredPrompt) {
    _deferredPrompt.prompt();
    _deferredPrompt.userChoice.then(function(r) {
      if (r.outcome === 'accepted') console.info('[Ode PWA] Installée');
      _deferredPrompt = null;
    });
  }
}

function pwaDismiss() {
  document.getElementById('pwa-banner').classList.remove('show');
  sessionStorage.setItem('pwa-dismissed', '1');
}

/* ── Abonnement notifications push ── */
async function requestPushPermission() {
  if (!('PushManager' in window) || !_swRegistration) return;
  if (sessionStorage.getItem('push-declined')) return;

  try {
    /* Récupérer la clé VAPID publique depuis le worker */
    const res     = await fetch(PUSH_WORKER_URL + '/vapid-public-key');
    const { publicKey } = await res.json();

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      sessionStorage.setItem('push-declined', '1');
      return;
    }

    /* S'abonner */
    const sub = await _swRegistration.pushManager.subscribe({
      userVisibleOnly:      true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });

    _pushSubscription = sub;

    /* Envoyer l'abonnement au worker */
    await fetch(PUSH_WORKER_URL + '/subscribe', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(sub.toJSON())
    });

    console.info('[Ode PWA] Abonné aux notifications');

  } catch(e) {
    console.warn('[Ode PWA] Push échec:', e);
  }
}

/* Convertit la clé VAPID base64 en Uint8Array */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw     = window.atob(base64);
  const out     = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

/* ── Panneau admin ── */
/* Activer le FAB admin avec un mot de passe (triple-tap sur le footer) ── */
let _adminTaps = 0;
document.addEventListener('click', function(e) {
  if (e.target.closest('.page-footer')) {
    _adminTaps++;
    if (_adminTaps >= 5) {
      const pwd = prompt('Mot de passe admin :');
      if (pwd === ADMIN_SECRET) {
        document.getElementById('admin-fab').classList.add('show');
        adminLoadStats();
      }
      _adminTaps = 0;
    }
    setTimeout(function(){ _adminTaps = 0; }, 2000);
  }
});

async function adminLoadStats() {
  try {
    const res  = await fetch(PUSH_WORKER_URL + '/stats', {
      headers: { 'Authorization': 'Bearer ' + ADMIN_SECRET }
    });
    const data = await res.json();
    document.getElementById('admin-stats').textContent =
      data.subscribers + ' citoyen(s) abonné(s) aux alertes';
  } catch(e) {}
}

async function adminSendNotif() {
  const title = document.getElementById('admin-notif-title').value.trim();
  const body  = document.getElementById('admin-notif-body').value.trim();
  if (!body) { alert('Écrivez un message.'); return; }

  const btn = document.querySelector('.admin-send');
  btn.disabled = true;
  btn.textContent = 'Envoi…';

  try {
    const res  = await fetch(PUSH_WORKER_URL + '/notify', {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': 'Bearer ' + ADMIN_SECRET
      },
      body: JSON.stringify({ title, body })
    });
    const data = await res.json();
    alert('✅ ' + data.sent + ' notification(s) envoyée(s).');
    document.getElementById('admin-notif-body').value = '';
    document.getElementById('admin-panel').classList.remove('open');
    adminLoadStats();
  } catch(e) {
    alert('❌ Erreur : ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📣 Envoyer à tous';
  }
}
</script>
